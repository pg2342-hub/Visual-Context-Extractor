openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: analyze
    description: Image analysis operations
  - name: project-documents
    description: Private client project reference documents
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List the current user's client projects
      responses:
        "200":
          description: Client projects owned by the current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientProjectsResponse"
    post:
      operationId: createProject
      tags: [projects]
      summary: Create a client project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientProjectInput"
      responses:
        "201":
          description: The created project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientProject"
  /projects/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    get:
      operationId: getProject
      tags: [projects]
      summary: Get one owned client project
      responses:
        "200":
          description: The requested client project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientProject"
        "404":
          description: Project not found
    patch:
      operationId: updateProject
      tags: [projects]
      summary: Update an owned client project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientProjectUpdate"
      responses:
        "200":
          description: The updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientProject"
        "404":
          description: Project not found
    delete:
      operationId: deleteProject
      tags: [projects]
      summary: Delete an owned client project
      responses:
        "204":
          description: Project and its project-specific settings were deleted
        "404":
          description: Project not found
  /projects/{id}/documents:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    get:
      operationId: listProjectDocuments
      tags: [project-documents]
      summary: List reference documents for an owned client project
      responses:
        "200":
          description: Project documents
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectDocumentsResponse"
        "404":
          description: Project not found
    post:
      operationId: createProjectDocument
      tags: [project-documents]
      summary: Finalize and extract text from an uploaded project document
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectDocumentInput"
      responses:
        "201":
          description: Uploaded document registered and indexed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectDocument"
        "400":
          description: Invalid or unsupported document
        "404":
          description: Project not found
        "413":
          description: File exceeds the upload limit
  /projects/{id}/documents/upload-url:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    post:
      operationId: requestProjectDocumentUploadUrl
      tags: [project-documents]
      summary: Request a private direct-upload URL for a project document
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectDocumentUploadRequest"
      responses:
        "200":
          description: Presigned upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectDocumentUploadResponse"
        "400":
          description: Invalid or unsupported document
        "404":
          description: Project not found
        "413":
          description: File exceeds the upload limit
  /projects/{id}/documents/{documentId}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      - name: documentId
        in: path
        required: true
        schema:
          type: integer
    delete:
      operationId: deleteProjectDocument
      tags: [project-documents]
      summary: Remove a reference document from an owned client project
      responses:
        "204":
          description: Document and private file deleted
        "404":
          description: Project or document not found
  /analyze:
    post:
      operationId: analyzeImage
      tags: [analyze]
      summary: Analyze one or more images
      description: Receives base64 images and an extraction mode, returns structured context via Claude
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalyzeImageRequest"
      responses:
        "200":
          description: Structured context extracted from the image(s)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyzeImageResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error or AI API failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ImageInput:
      type: object
      properties:
        imageData:
          type: string
          description: Base64-encoded image data
        mimeType:
          type: string
          description: MIME type of the image
      required:
        - imageData
        - mimeType
    AnalyzeImageRequest:
      type: object
      properties:
        images:
          type: array
          items:
            $ref: "#/components/schemas/ImageInput"
          minItems: 1
          description: One or more images to analyze
        mode:
          type: string
          enum:
            - summarize
            - extract_data_points
            - identify_ui_elements
            - describe_code
            - system_design
          description: The type of context extraction to perform
        projectId:
          type: integer
          description: Optional owned client project whose context should inform the analysis
      required:
        - images
        - mode
    ClientProject:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        knowledge:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, name, description, knowledge, createdAt, updatedAt]
    ClientProjectsResponse:
      type: object
      properties:
        projects:
          type: array
          items:
            $ref: "#/components/schemas/ClientProject"
      required: [projects]
    ClientProjectInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          maxLength: 2000
      required: [name]
    ClientProjectUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          maxLength: 2000
        knowledge:
          type: string
          maxLength: 30000
    ProjectDocument:
      type: object
      properties:
        id: { type: integer }
        projectId: { type: integer }
        originalName: { type: string }
        mimeType: { type: string }
        sizeBytes: { type: integer }
        createdAt: { type: string, format: date-time }
      required: [id, projectId, originalName, mimeType, sizeBytes, createdAt]
    ProjectDocumentsResponse:
      type: object
      properties:
        documents:
          type: array
          items:
            $ref: "#/components/schemas/ProjectDocument"
      required: [documents]
    ProjectDocumentUploadRequest:
      type: object
      properties:
        fileName: { type: string, minLength: 1, maxLength: 255 }
        sizeBytes: { type: integer, minimum: 1, maximum: 10485760 }
        contentType: { type: string, minLength: 1 }
      required: [fileName, sizeBytes, contentType]
    ProjectDocumentUploadResponse:
      type: object
      properties:
        uploadURL: { type: string, format: uri }
        objectPath: { type: string }
      required: [uploadURL, objectPath]
    ProjectDocumentInput:
      type: object
      properties:
        fileName: { type: string, minLength: 1, maxLength: 255 }
        sizeBytes: { type: integer, minimum: 1, maximum: 10485760 }
        contentType: { type: string, minLength: 1 }
        objectPath: { type: string, minLength: 1 }
      required: [fileName, sizeBytes, contentType, objectPath]
    AnalyzeImageResponse:
      type: object
      properties:
        summary:
          type: string
          description: A concise summary of what the image(s) depict
        text_content:
          type: string
          description: Any readable text visible in the image(s), or empty string if none
        tags:
          type: array
          items:
            type: string
          description: Relevant descriptive tags
        technical_details:
          type: object
          description: Technical observations about the image(s)
          properties:
            composition:
              type: string
            lighting:
              type: string
            quality:
              type: string
          required:
            - composition
            - lighting
            - quality
        mode_result:
          type: object
          description: Mode-specific structured output
          additionalProperties: true
      required:
        - summary
        - text_content
        - tags
        - technical_details
        - mode_result
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        details:
          type: string
      required:
        - error
