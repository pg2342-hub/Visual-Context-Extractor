openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: analyze
    description: Image analysis operations
  - name: project-documents
    description: Private client project reference documents
  - name: project-connections
    description: Client-authorized, metadata-only source connections
  - name: project-history
    description: Project-scoped image analysis history
  - name: project-findings
    description: Human-reviewed findings carried forward in project context
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List the current user's client projects
      responses:
        "200":
          description: Client projects owned by the current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientProjectsResponse"
    post:
      operationId: createProject
      tags: [projects]
      summary: Create a client project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientProjectInput"
      responses:
        "201":
          description: The created project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientProject"
  /projects/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    get:
      operationId: getProject
      tags: [projects]
      summary: Get one owned client project
      responses:
        "200":
          description: The requested client project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientProject"
        "404":
          description: Project not found
    patch:
      operationId: updateProject
      tags: [projects]
      summary: Update an owned client project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientProjectUpdate"
      responses:
        "200":
          description: The updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientProject"
        "404":
          description: Project not found
    delete:
      operationId: deleteProject
      tags: [projects]
      summary: Delete an owned client project
      responses:
        "204":
          description: Project and its project-specific settings were deleted
        "404":
          description: Project not found
  /projects/{id}/documents:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    get:
      operationId: listProjectDocuments
      tags: [project-documents]
      summary: List reference documents for an owned client project
      responses:
        "200":
          description: Project documents
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectDocumentsResponse"
        "404":
          description: Project not found
    post:
      operationId: createProjectDocument
      tags: [project-documents]
      summary: Finalize and extract text from an uploaded project document
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectDocumentInput"
      responses:
        "201":
          description: Uploaded document registered and indexed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectDocument"
        "400":
          description: Invalid or unsupported document
        "404":
          description: Project not found
        "413":
          description: File exceeds the upload limit
  /projects/{id}/documents/upload-url:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    post:
      operationId: requestProjectDocumentUploadUrl
      tags: [project-documents]
      summary: Request a private direct-upload URL for a project document
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectDocumentUploadRequest"
      responses:
        "200":
          description: Presigned upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectDocumentUploadResponse"
        "400":
          description: Invalid or unsupported document
        "404":
          description: Project not found
        "413":
          description: File exceeds the upload limit
  /projects/{id}/documents/{documentId}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      - name: documentId
        in: path
        required: true
        schema:
          type: integer
    delete:
      operationId: deleteProjectDocument
      tags: [project-documents]
      summary: Remove a reference document from an owned client project
      responses:
        "204":
          description: Document and private file deleted
        "404":
          description: Project or document not found
  /projects/{id}/connections:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    get:
      operationId: listProjectConnections
      tags: [project-connections]
      summary: List metadata-only source connections for an owned client project
      responses:
        "200":
          description: Project source connections, excluding credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectConnectionsResponse"
        "404":
          description: Project not found
    post:
      operationId: createProjectConnection
      tags: [project-connections]
      summary: Store a client-authorized source credential securely
      description: Credentials are encrypted at rest and never returned. Only schema and metadata may be used in analysis.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectConnectionInput"
      responses:
        "201":
          description: The project source connection, excluding credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectConnection"
        "400":
          description: Invalid connection input
        "404":
          description: Project not found
  /projects/{id}/connections/{connectionId}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      - name: connectionId
        in: path
        required: true
        schema:
          type: integer
    patch:
      operationId: updateProjectConnection
      tags: [project-connections]
      summary: Update source metadata approval for an owned project connection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectConnectionUpdate"
      responses:
        "200":
          description: Updated project source connection, excluding credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectConnection"
        "404":
          description: Project or connection not found
    delete:
      operationId: deleteProjectConnection
      tags: [project-connections]
      summary: Disconnect and remove a source from an owned client project
      responses:
        "204":
          description: Connection and encrypted credentials deleted
        "404":
          description: Project or connection not found
  /projects/{id}/analysis-runs:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    get:
      operationId: listProjectAnalysisRuns
      tags: [project-history]
      summary: List analysis history for an owned client project
      responses:
        "200":
          description: Analysis runs in reverse chronological order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectAnalysisRunsResponse"
        "404":
          description: Project not found
  /projects/{id}/analysis-runs/{runId}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      - name: runId
        in: path
        required: true
        schema:
          type: integer
    get:
      operationId: getProjectAnalysisRun
      tags: [project-history]
      summary: Get a saved analysis run and its finding review states
      responses:
        "200":
          description: Full saved result for an owned project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectAnalysisRunDetail"
        "404":
          description: Project or analysis run not found
    delete:
      operationId: deleteProjectAnalysisRun
      tags: [project-history]
      summary: Permanently delete a saved analysis, optionally retaining reviewed findings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalysisRunDeletion"
      responses:
        "204":
          description: Analysis and unretained findings deleted
        "400":
          description: Invalid deletion options
        "401":
          description: Sign in required
        "404":
          description: Project or analysis run not found
  /projects/{id}/findings:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    get:
      operationId: listProjectFindings
      tags: [project-findings]
      summary: List findings and review states for an owned client project
      responses:
        "200":
          description: Project findings, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectFindingsResponse"
        "404":
          description: Project not found
    post:
      operationId: createProjectFinding
      tags: [project-findings]
      summary: Add a manually reviewed project finding
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectFindingInput"
      responses:
        "201":
          description: Manually added project finding
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectFinding"
        "400":
          description: Invalid finding
        "404":
          description: Project not found
  /projects/{id}/findings/{findingId}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      - name: findingId
        in: path
        required: true
        schema:
          type: integer
    patch:
      operationId: updateProjectFinding
      tags: [project-findings]
      summary: Review or update an owned project finding
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectFindingUpdate"
      responses:
        "200":
          description: Updated project finding
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectFinding"
        "400":
          description: Invalid finding update
        "404":
          description: Project or finding not found
    delete:
      operationId: deleteProjectFinding
      tags: [project-findings]
      summary: Permanently remove an owned project finding without changing saved analyses
      responses:
        "204":
          description: Finding permanently deleted; historical memory snapshots are unchanged
        "401":
          description: Sign in required
        "404":
          description: Project or finding not found
  /analyze:
    post:
      operationId: analyzeImage
      tags: [analyze]
      summary: Analyze one or more images
      description: Receives base64 images and an extraction mode, returns structured context via Claude
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalyzeImageRequest"
      responses:
        "200":
          description: Structured context extracted from the image(s)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyzeImageResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error or AI API failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ImageInput:
      type: object
      properties:
        imageData:
          type: string
          description: Base64-encoded image data
        mimeType:
          type: string
          description: MIME type of the image
        fileName:
          type: string
          maxLength: 255
          description: Original image file name for project analysis provenance
      required:
        - imageData
        - mimeType
    AnalyzeImageRequest:
      type: object
      properties:
        images:
          type: array
          items:
            $ref: "#/components/schemas/ImageInput"
          minItems: 1
          description: One or more images to analyze
        mode:
          type: string
          enum:
            - summarize
            - extract_data_points
            - identify_ui_elements
            - describe_code
            - system_design
          description: The type of context extraction to perform
        projectId:
          type: integer
          description: Optional owned client project whose context should inform the analysis
      required:
        - images
        - mode
    ClientProject:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        knowledge:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, name, description, knowledge, createdAt, updatedAt]
    ClientProjectsResponse:
      type: object
      properties:
        projects:
          type: array
          items:
            $ref: "#/components/schemas/ClientProject"
      required: [projects]
    ClientProjectInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          maxLength: 2000
      required: [name]
    ClientProjectUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          maxLength: 2000
        knowledge:
          type: string
          maxLength: 30000
    ProjectDocument:
      type: object
      properties:
        id: { type: integer }
        projectId: { type: integer }
        originalName: { type: string }
        mimeType: { type: string }
        sizeBytes: { type: integer }
        createdAt: { type: string, format: date-time }
      required: [id, projectId, originalName, mimeType, sizeBytes, createdAt]
    ProjectDocumentsResponse:
      type: object
      properties:
        documents:
          type: array
          items:
            $ref: "#/components/schemas/ProjectDocument"
      required: [documents]
    ProjectDocumentUploadRequest:
      type: object
      properties:
        fileName: { type: string, minLength: 1, maxLength: 255 }
        sizeBytes: { type: integer, minimum: 1, maximum: 10485760 }
        contentType: { type: string, minLength: 1 }
      required: [fileName, sizeBytes, contentType]
    ProjectDocumentUploadResponse:
      type: object
      properties:
        uploadURL: { type: string, format: uri }
        objectPath: { type: string }
      required: [uploadURL, objectPath]
    ProjectDocumentInput:
      type: object
      properties:
        fileName: { type: string, minLength: 1, maxLength: 255 }
        sizeBytes: { type: integer, minimum: 1, maximum: 10485760 }
        contentType: { type: string, minLength: 1 }
        objectPath: { type: string, minLength: 1 }
      required: [fileName, sizeBytes, contentType, objectPath]
    ProjectConnectionProvider:
      type: string
      enum:
        - postgres
        - mysql
        - sqlserver
        - snowflake
        - bigquery
        - databricks
        - redshift
        - mongodb
        - salesforce
        - hubspot
    ProjectConnection:
      type: object
      properties:
        id: { type: integer }
        projectId: { type: integer }
        provider:
          $ref: "#/components/schemas/ProjectConnectionProvider"
        displayName: { type: string }
        metadata: { type: string }
        includeInAnalysis: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [id, projectId, provider, displayName, metadata, includeInAnalysis, createdAt, updatedAt]
    ProjectConnectionsResponse:
      type: object
      properties:
        connections:
          type: array
          items:
            $ref: "#/components/schemas/ProjectConnection"
      required: [connections]
    ProjectConnectionInput:
      type: object
      properties:
        provider:
          $ref: "#/components/schemas/ProjectConnectionProvider"
        displayName: { type: string, minLength: 1, maxLength: 120 }
        credentials:
          type: string
          minLength: 1
          maxLength: 50000
          description: Secret credential or connection string. Never returned and encrypted before storage.
        metadata:
          type: string
          maxLength: 30000
          description: Schema or object metadata only; do not include records or sample values.
        includeInAnalysis: { type: boolean }
      required: [provider, displayName, credentials]
    ProjectConnectionUpdate:
      type: object
      properties:
        displayName: { type: string, minLength: 1, maxLength: 120 }
        metadata:
          type: string
          maxLength: 30000
          description: Schema or object metadata only; do not include records or sample values.
        includeInAnalysis: { type: boolean }
    AnalyzeImageResponse:
      type: object
      properties:
        summary:
          type: string
          description: A concise summary of what the image(s) depict
        text_content:
          type: string
          description: Any readable text visible in the image(s), or empty string if none
        tags:
          type: array
          items:
            type: string
          description: Relevant descriptive tags
        technical_details:
          type: object
          description: Technical observations about the image(s)
          properties:
            composition:
              type: string
            lighting:
              type: string
            quality:
              type: string
          required:
            - composition
            - lighting
            - quality
        mode_result:
          type: object
          description: Mode-specific structured output
          additionalProperties: true
        analysisRunId:
          type: integer
          description: Saved project analysis run, when projectId was provided
        candidate_findings:
          type: array
          items:
            $ref: "#/components/schemas/ProjectFinding"
          description: Model-proposed findings for human review in a project analysis
        memory_used:
          $ref: "#/components/schemas/ProjectAnalysisMemorySnapshot"
      required:
        - summary
        - text_content
        - tags
        - technical_details
        - mode_result
    ProjectFindingType:
      type: string
      enum: [fact, conflict, open_question]
    ProjectFindingStatus:
      type: string
      enum: [pending, confirmed, open_conflict, dismissed, retired]
    ProjectFindingSourceKind:
      type: string
      enum: [image, project_document, project_knowledge, multiple, manual]
    FindingImageRegion:
      type: object
      properties:
        imageRef:
          type: string
          description: Image source ID, such as IMG-1
        x: { type: number, minimum: 0, maximum: 1 }
        y: { type: number, minimum: 0, maximum: 1 }
        width: { type: number, minimum: 0, maximum: 1 }
        height: { type: number, minimum: 0, maximum: 1 }
      required: [imageRef, x, y, width, height]
    ProjectFinding:
      type: object
      properties:
        id: { type: integer }
        projectId: { type: integer }
        analysisRunId: { type: ["integer", "null"] }
        statement: { type: string }
        type:
          $ref: "#/components/schemas/ProjectFindingType"
        status:
          $ref: "#/components/schemas/ProjectFindingStatus"
        sourceKind:
          $ref: "#/components/schemas/ProjectFindingSourceKind"
        sourceRefs:
          type: array
          items: { type: string }
        sourceLabels:
          type: array
          items: { type: string }
        regions:
          type: array
          description: Where in each cited image the finding is visible, as boxes in fractions of the image size. Empty when the model could not place it.
          items:
            $ref: "#/components/schemas/FindingImageRegion"
        createdBy: { type: string }
        reviewedBy: { type: ["string", "null"] }
        reviewedAt: { type: ["string", "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required:
        - id
        - projectId
        - analysisRunId
        - statement
        - type
        - status
        - sourceKind
        - sourceRefs
        - sourceLabels
        - createdBy
        - reviewedBy
        - reviewedAt
        - createdAt
        - updatedAt
    ProjectFindingsResponse:
      type: object
      properties:
        findings:
          type: array
          items:
            $ref: "#/components/schemas/ProjectFinding"
      required: [findings]
    AnalysisRunDeletion:
      type: object
      required: [keepReviewedFindings]
      properties:
        keepReviewedFindings:
          type: boolean
          description: Retain human-reviewed findings with their review metadata and deleted-analysis provenance. Pending candidates are always deleted.
    ProjectFindingInput:
      type: object
      properties:
        statement: { type: string, minLength: 1, maxLength: 2000 }
        type:
          $ref: "#/components/schemas/ProjectFindingType"
        status:
          type: string
          enum: [confirmed, open_conflict]
      required: [statement, type, status]
    ProjectFindingUpdate:
      type: object
      minProperties: 1
      properties:
        statement: { type: string, minLength: 1, maxLength: 2000 }
        type:
          $ref: "#/components/schemas/ProjectFindingType"
        status:
          type: string
          enum: [confirmed, open_conflict, dismissed, retired]
    ProjectAnalysisMemoryEntry:
      type: object
      properties:
        id: { type: integer }
        statement: { type: string }
        sourceLabels:
          type: array
          items: { type: string }
      required: [id, statement, sourceLabels]
    ProjectAnalysisMemorySnapshot:
      type: object
      properties:
        confirmedFacts:
          type: array
          items:
            $ref: "#/components/schemas/ProjectAnalysisMemoryEntry"
        openConflicts:
          type: array
          items:
            $ref: "#/components/schemas/ProjectAnalysisMemoryEntry"
        openQuestions:
          type: array
          description: Reviewed open questions, still unresolved. Optional for older saved runs.
          items:
            $ref: "#/components/schemas/ProjectAnalysisMemoryEntry"
      required: [confirmedFacts, openConflicts]
    ProjectAnalysisRun:
      type: object
      properties:
        id: { type: integer }
        projectId: { type: integer }
        mode:
          type: string
          enum: [summarize, extract_data_points, identify_ui_elements, describe_code, system_design]
        imageNames:
          type: array
          items: { type: string }
        summary: { type: string }
        createdAt: { type: string, format: date-time }
      required: [id, projectId, mode, imageNames, summary, createdAt]
    ProjectAnalysisRunsResponse:
      type: object
      properties:
        runs:
          type: array
          items:
            $ref: "#/components/schemas/ProjectAnalysisRun"
      required: [runs]
    ProjectAnalysisRunDetail:
      type: object
      properties:
        id: { type: integer }
        projectId: { type: integer }
        mode:
          type: string
          enum: [summarize, extract_data_points, identify_ui_elements, describe_code, system_design]
        imageNames:
          type: array
          items: { type: string }
        summary: { type: string }
        createdAt: { type: string, format: date-time }
        result:
          $ref: "#/components/schemas/AnalyzeImageResponse"
      required: [id, projectId, mode, imageNames, summary, createdAt, result]
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        details:
          type: string
      required:
        - error
