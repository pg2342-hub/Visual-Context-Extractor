kind = "web"
previewPath = "/"
title = "Image Context Extractor"
version = "1.0.0"
id = "artifacts/image-analyzer"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
localPort = 22122
name = "web"
paths = ["/"]

[services.development]
run = "pnpm --filter @workspace/image-analyzer run dev"

[services.env]
PORT = "22122"
BASE_PATH = "/"

[services.production]
build = ["pnpm", "--filter", "@workspace/image-analyzer", "run", "build"]
publicDir = "artifacts/image-analyzer/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"
